<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./public/Icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>Loom | Connect, Share, and Weave Your Story</title>
    <meta name="title" content="Loom | Connect, Share, and Weave Your Story" />
    <meta name="description" content="Join Loom, the modern social space designed for meaningful connections. Share your world, discover new perspectives, and stay woven together." />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://loom-app.com/" />
    <meta property="og:title" content="Loom | Connect, Share, and Weave Your Story" />
    <meta property="og:description" content="The social media app where every thread matters. Experience a cleaner, faster way to stay connected." />
    <meta property="og:image" content="/og-banner.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://loom-app.com/" />
    <meta property="twitter:title" content="Loom | Connect, Share, and Weave Your Story" />
    <meta property="twitter:description" content="Join the conversation on Loom. Share updates, photos, and connect with your community." />
    <meta property="twitter:image" content="/og-banner.png" />

    <!-- Performance & Security -->
    <meta name="theme-color" content="#7c3aed" /> <!-- Modern Purple/Indigo vibe -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://loom-app.com/" />
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 20px; font-family: sans-serif;">
        <h2>Loom requires JavaScript</h2>
        <p>Please enable JavaScript in your browser settings to continue.</p>
      </div>
    </noscript>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
